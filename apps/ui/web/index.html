<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F1" />
    <!-- No-flash theme: apply the persisted theme to <html data-theme> before the
         first paint. The 'app-theme' key MUST match APP_THEME_KEY in
         src/config/app.ts and the useTheme hook. Default is light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('app-theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!-- The three typefaces (Bricolage Grotesque, Plus Jakarta Sans, IBM Plex
         Mono) are self-hosted via src/styles/tokens.css — no external font
         request, and Vite fingerprints them, so no preload can name them
         here without going stale on the next build. -->
    <title>Property Panda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
